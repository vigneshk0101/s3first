repos:
  # ---------------------------
  # Basic Git Hygiene
  # ---------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ---------------------------
  # Code Formatting
  # ---------------------------
  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
      - id: black

  # ---------------------------
  # Security (Secrets Scan)
  # ---------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks