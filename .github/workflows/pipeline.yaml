name: S3 DevSecOps Pipeline

on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # 🔐 SAST (SonarCloud)
      # ---------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Install Terraform
      - name: Install Terraform
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3-pip
          wget https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
          unzip terraform_1.6.6_linux_amd64.zip
          sudo mv terraform /usr/local/bin/

      # Install Checkov (IaC Security)
      - name: Install Checkov
        run: pip install checkov

      # Install Gitleaks (Secrets)
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      # ---------------------------
      # 📦 SCA (Dependency + Config Scan)
      # ---------------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      # ---------------------------
      # 🔍 Security Scans
      # ---------------------------
      - name: Run Checkov
        run: checkov -d terraform

      - name: Run Gitleaks
        run: gitleaks detect --source .

      # Configure AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Terraform
      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve

      # ---------------------------
      # 🌐 DAST (ZAP Scan)
      # ---------------------------
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://example.com"  # ⚠️ replace with your app URL

      # ---------------------------
      # 🔄 Auto-Remediation (CSPM)
      # ---------------------------
      - name: Detect and Fix Public S3 Buckets
        run: |
          echo "Scanning all S3 buckets..."

          BUCKETS=$(aws s3api list-buckets --query "Buckets[].Name" --output text)

          for BUCKET in $BUCKETS; do
            echo "Checking bucket: $BUCKET"

            BLOCK=$(aws s3api get-public-access-block \
              --bucket $BUCKET \
              --query "PublicAccessBlockConfiguration.BlockPublicAcls" \
              --output text 2>/dev/null || echo "false")

            if [ "$BLOCK" != "True" ]; then
              echo "Public access issue found in $BUCKET — fixing..."

              aws s3api put-public-access-block \
                --bucket $BUCKET \
                --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

              echo "Fixed: $BUCKET"
            else
              echo "Already secure: $BUCKET"
            fi

            echo "-----------------------------"
          done

          echo "Scan completed at $(date)"