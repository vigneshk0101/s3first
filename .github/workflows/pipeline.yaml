name: S3 DevSecOps Pipeline

on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------
      # 📥 Checkout Code
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # 🔐 SAST (SonarCloud)
      # ---------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ---------------------------
      # ⚙️ Install Dependencies
      # ---------------------------
      - name: Install Terraform + Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3-pip

          # Terraform
          wget https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
          unzip terraform_1.6.6_linux_amd64.zip
          sudo mv terraform /usr/local/bin/

          # Trivy
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.2_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.2_Linux-64bit.deb

      - name: Install Checkov
        run: pip install checkov==3.2.0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      # ---------------------------
      # 📦 SCA (Trivy Scan)
      # ---------------------------
      - name: Run Trivy Scan (JSON Report)
        run: |
          trivy fs . --format json --output trivy-report.json

      # ---------------------------
      # 🔍 IaC Security (Checkov)
      # ---------------------------
      - name: Run Checkov (JSON Report)
        run: |
          checkov -d terraform --output json > checkov-report.json

      # ---------------------------
      # 🔑 Secrets Scan (Gitleaks)
      # ---------------------------
      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif

      # ---------------------------
      # ☁️ Configure AWS
      # ---------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ---------------------------
      # 🏗️ Terraform Deployment
      # ---------------------------
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ---------------------------
      # 🔄 Auto-Remediation
      # ---------------------------
      - name: Run S3 Auto-Remediation
        run: |
          chmod +x scripts/remediate.sh
          ./scripts/remediate.sh

      # ---------------------------
      # 📤 Upload Reports (GitHub)
      # ---------------------------
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

      # ---------------------------
      # 📤 Upload Reports to S3
      # ---------------------------
      - name: Upload Reports to S3
        run: |
          TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)

          aws s3 cp gitleaks-report.sarif s3://s3first-project-all-files/reports/$TIMESTAMP/
          aws s3 cp trivy-report.json s3://s3first-project-all-files/reports/$TIMESTAMP/
          aws s3 cp checkov-report.json s3://s3first-project-all-files/reports/$TIMESTAMP/