name: S3 DevSecOps Pipeline

on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------
      # 📥 Checkout Code
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # 🔐 SAST (SonarCloud)
      # ---------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=vigneshk0101_s3first
            -Dsonar.organization=vigneshk0101
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ---------------------------
      # ⚙️ Install Dependencies
      # ---------------------------
      - name: Install python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3-pip

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Verify Terraform
        run: terraform -version

      - name: Install Checkov
        run: pip install checkov==3.2.0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      # ---------------------------
      # 📦 Security Scans
      # ---------------------------
      - name: Run Trivy Scan
        run: |
          trivy fs . --format json --output trivy-report.json

      - name: Run Checkov
        run: |
          checkov -d terraform --output json > checkov-report.json

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif

      # ---------------------------
      # ☁️ Configure AWS
      # ---------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ---------------------------
      # 🏗️ Terraform Deployment
      # ---------------------------
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ---------------------------
      # 🔄 Auto-Remediation
      # ---------------------------
      - name: Run S3 Auto-Remediation
        run: |
          chmod +x scripts/remediate.sh
          ./scripts/remediate.sh

      # ---------------------------
      # 📤 Upload Reports (GitHub)
      # ---------------------------
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

      # ---------------------------
      # 📤 Upload Reports to S3 (ALWAYS RUN)
      # ---------------------------
      - name: Upload Reports to S3
        if: always()
        run: |
          TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)

          aws s3 cp gitleaks-report.sarif s3://s3first-project-all-files/reports/$TIMESTAMP/ || true
          aws s3 cp trivy-report.json s3://s3first-project-all-files/reports/$TIMESTAMP/ || true
          aws s3 cp checkov-report.json s3://s3first-project-all-files/reports/$TIMESTAMP/ || true